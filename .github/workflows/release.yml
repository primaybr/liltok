name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Ensure Starter Cache
        run: |
          if [ ! -f internal/db/starter_cache.json.gz ]; then
            go run ./cmd/build_starter_cache
          fi

      - name: Cross-Compile Binaries
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0-beta}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=${TAG_NAME} -X main.commit=${GITHUB_SHA} -X main.date=${BUILD_DATE}"

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/liltok-linux-amd64 ./cmd/liltok

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/liltok-linux-arm64 ./cmd/liltok

          # macOS amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/liltok-darwin-amd64 ./cmd/liltok

          # macOS arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/liltok-darwin-arm64 ./cmd/liltok

          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/liltok-windows-amd64.exe ./cmd/liltok

      - name: Package Release Assets and Checksums
        run: |
          cp internal/db/starter_cache.json.gz dist/
          cd dist
          sha256sum liltok-* starter_cache.json.gz > checksums.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/liltok-linux-amd64
            dist/liltok-linux-arm64
            dist/liltok-darwin-amd64
            dist/liltok-darwin-arm64
            dist/liltok-windows-amd64.exe
            dist/starter_cache.json.gz
            dist/checksums.txt
          generate_release_notes: true
