name: Build and Release Starter Cache

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Tests
        run: go test ./...

      - name: Build Starter Cache
        run: go run ./cmd/build_starter_cache

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: internal/db/starter_cache.json.gz
          generate_release_notes: true